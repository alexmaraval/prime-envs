[project]
name = "bird"
description = "Multi-turn BIRD-SQL environment with local SQLite database access"
tags = ["sql", "bird", "tool-use", "multiturn", "rlvr"]
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.10",
    "datasets>=2.18.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "bird.py",
    "bird_descriptors.py",
    "bird_sql_cache.py",
    "README.md",
    "pyproject.toml",
    "configs/**/*.toml",
    "scripts/*.py",
]
exclude = [
    "data/**",
    "outputs/**",
    "**/*.sqlite",
    "**/*.db",
]

[tool.verifiers.eval]
num_examples = 8
rollouts_per_example = 1
